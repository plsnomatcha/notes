<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="list" class="screen">
  <div class="top"><h1 class="big">Notes</h1><button class="glass bp" id="bp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back to Public</button><button class="glass lockbtn" id="lk" aria-label="Lock"></button></div>
  <label class="glass search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Search" autocomplete="off">
  </label>
  <div id="items"></div>
</section>

<section id="detail" class="screen">
  <div class="bar">
    <button class="glass back" id="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back
    </button>
  </div>
  <div class="dt" id="dd"></div>
  <h1 class="title" id="dt"></h1>
  <div class="pager" id="pg"></div>
  <div class="dots" id="dots"></div>
  <div class="glass hlbar" id="hlb">
    <button class="pen" id="pen" aria-label="Highlighter" title="Highlighter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6L9 21H3v-6z"/><path d="M12 6l6 6"/></svg></button>
<div class="pal" id="pal">
      <button class="sw" data-c="0" style="--c:#ffd60a" aria-label="Yellow"></button>
      <button class="sw" data-c="1" style="--c:#34c759" aria-label="Green"></button>
      <button class="sw" data-c="2" style="--c:#0a84ff" aria-label="Blue"></button>
      <button class="sw" data-c="3" style="--c:#ff2d55" aria-label="Pink"></button>
      <button class="sw" data-c="4" style="--c:#af52de" aria-label="Purple"></button>
      <button class="sw" data-c="5" style="--c:#8e8e93" aria-label="Gray"></button>
      <button class="sw er" data-c="e" aria-label="Remove highlight"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="hint">Select text, then pick a color</div>  </div>
</section>

<div class="lk" id="lko">
  <div class="lc"><div class="q">Enter password</div><div class="pcd" id="pd"><i></i><i></i><i></i><i></i></div><div class="kp" id="kp"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><span></span><button data-k="0">0</button><button data-k="x" aria-label="Delete"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M13 10l4 4M17 10l-4 4"/></svg></button></div></div>
</div>
<div class="ov" id="ov">
  <div class="pv" id="pv"></div>
  <div class="glass mn"><button id="cp"><span id="cpt">Copy notes</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
</div>
<script src="script.js"></script>
</body>
</html>
